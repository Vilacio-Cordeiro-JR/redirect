<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCOACI - Sistema de Controle Operacional do Arquivo Corrente e Intermediário</title>

  <!-- PWA Metadata & Configuration -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SCOACI" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
</head>
<body>
  <main id="app">
    <h1>SCOACI</h1>
    <p>Sistema de Controle Operacional do Arquivo Corrente e Intermediário</p>
  </main>

  <!-- Registro do Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SCOACI Service Worker registrado:', reg.scope))
          .catch(err => console.error('Falha ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
